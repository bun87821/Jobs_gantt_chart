<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案時程追蹤</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --good: #0ca30c;
    --good-text: #006300;
    --weekend: rgba(11,11,11,0.035);
    --today-bg: rgba(42,120,214,0.08);
    --hover-wash: rgba(11,11,11,0.05);
    --s1: #2a78d6; --s2: #1baf7a; --s3: #eda100; --s4: #008300;
    --s5: #4a3aa7; --s6: #e34948; --s7: #e87ba4; --s8: #eb6834;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --good: #0ca30c;
      --good-text: #0ca30c;
      --weekend: rgba(255,255,255,0.045);
      --today-bg: rgba(57,135,229,0.13);
      --hover-wash: rgba(255,255,255,0.07);
      --s1: #3987e5; --s2: #199e70; --s3: #c98500; --s4: #008300;
      --s5: #9085e9; --s6: #e66767; --s7: #d55181; --s8: #d95926;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  header.app {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-1);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  header.app h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header.app .spacer { flex: 1; }

  button {
    font: inherit;
    color: var(--text-primary);
    background: var(--surface-1);
    border: 1px solid var(--baseline);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
  }
  button:hover { background: var(--hover-wash); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { border-color: transparent; color: var(--text-secondary); }
  button.danger { color: #d03b3b; border-color: #d03b3b; background: transparent; }

  .tabs { display: inline-flex; gap: 2px; background: var(--hover-wash); border-radius: 9px; padding: 3px; }
  .tabs button { border: none; background: transparent; border-radius: 6px; padding: 5px 14px; color: var(--text-secondary); }
  .tabs button.active { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 2px rgba(0,0,0,0.12); font-weight: 600; }

  main { padding: 16px 20px 60px; max-width: 1400px; margin: 0 auto; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  /* ---------- Gantt ---------- */
  .gantt-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .gantt-toolbar .hint { color: var(--text-muted); font-size: 12.5px; }
  .gantt-scroll { overflow-x: auto; }
  .gantt {
    display: grid;
    min-width: max-content;
  }
  .g-namecol {
    position: sticky; left: 0; z-index: 5;
    background: var(--surface-1);
    border-right: 1px solid var(--baseline);
    grid-column: 1;
  }
  .g-headrow .g-namecol { border-bottom: 1px solid var(--baseline); }
  .g-timeline {
    grid-column: 2;
    position: relative;
    display: flex;
  }
  .g-headrow .g-timeline { border-bottom: 1px solid var(--baseline); }

  .g-month {
    border-right: 1px solid var(--grid);
    font-size: 12px; color: var(--text-secondary);
    padding: 4px 6px 0;
    white-space: nowrap; overflow: hidden;
    position: relative;
  }
  .g-month span { position: sticky; left: 226px; }
  .g-wk {
    flex: none;
    text-align: center;
    border-right: 1px solid var(--grid);
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 0;
    white-space: nowrap; overflow: hidden;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .g-wk:hover { background: var(--hover-wash); color: var(--text-primary); }
  .g-wk.cur { background: var(--today-bg); color: var(--accent); font-weight: 600; }
  .g-day {
    width: var(--dw);
    flex: none;
    text-align: center;
    border-right: 1px solid var(--grid);
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 0 5px;
    line-height: 1.25;
  }
  .g-day .dnum { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .g-day.weekend { background: var(--weekend); }
  .g-day.today { background: var(--today-bg); }
  .g-day.today .dnum {
    display: inline-block; min-width: 20px; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600;
  }

  .g-row { display: contents; }
  .g-row .g-namecol {
    padding: 8px 12px;
    border-bottom: 1px solid var(--grid);
    width: 226px;
    cursor: pointer;
  }
  .g-row .g-namecol:hover { background: var(--hover-wash); }
  .g-row .g-timeline { border-bottom: 1px solid var(--grid); height: 46px; }
  .p-name {
    display: flex; align-items: center; gap: 7px;
    font-weight: 600; font-size: 13.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .p-swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .p-dates { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; font-variant-numeric: tabular-nums; }
  .p-status { font-size: 11px; margin-left: 6px; font-weight: 500; }
  .p-status.done { color: var(--good-text); }
  .p-status.paused { color: var(--text-muted); }

  .g-cell {
    width: var(--dw); flex: none; height: 100%;
    border-right: 1px solid var(--grid);
    cursor: pointer;
  }
  .g-cell.weekend { background: var(--weekend); }
  .g-cell.today { background: var(--today-bg); }
  .g-cell:hover { background: var(--hover-wash); }

  .g-bar {
    position: absolute;
    top: 8px;
    height: 18px;
    border-radius: 4px;
    background: var(--c);
    opacity: 0.92;
    pointer-events: none;
  }
  .g-bar.done { opacity: 0.45; }
  /* 有進度 % 的專案：空心軌道 + 實心已完成段 */
  .g-bar.track { background: color-mix(in srgb, var(--c) 22%, transparent); opacity: 1; }
  .g-fill {
    position: absolute; top: 0; bottom: 0; left: 0;
    border-radius: 4px;
    background: var(--c);
  }
  .g-pct {
    position: absolute; top: 1px;
    font-size: 10.5px; font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .g-dot {
    position: absolute;
    top: 31px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 0 2px var(--surface-1);
    cursor: pointer;
    z-index: 2;
  }
  .g-dot.hollow {
    background: var(--surface-1);
    border: 2.5px solid var(--c);
  }
  .g-dot:hover { transform: scale(1.35); }

  .empty-state { padding: 60px 20px; text-align: center; color: var(--text-secondary); }
  .empty-state p { margin: 0 0 16px; }

  .legend-note {
    padding: 8px 14px; font-size: 12px; color: var(--text-muted);
    border-top: 1px solid var(--border);
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  .legend-note .k { display: inline-flex; align-items: center; gap: 6px; }
  .k-bar { width: 22px; height: 8px; border-radius: 3px; background: var(--accent); opacity: .9; }
  .k-track {
    width: 26px; height: 8px; border-radius: 3px;
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    position: relative; display: inline-block;
  }
  .k-track > span { position: absolute; inset: 0 auto 0 0; width: 55%; border-radius: 3px; background: var(--accent); }
  .k-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3px var(--baseline); }
  .k-dot.hollow { background: var(--surface-1); border: 2px solid var(--accent); }

  /* ---------- Tooltip ---------- */
  #tooltip {
    position: fixed; z-index: 100;
    max-width: 320px;
    background: var(--surface-1);
    border: 1px solid var(--baseline);
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    padding: 8px 11px;
    font-size: 12.5px;
    pointer-events: none;
    display: none;
  }
  #tooltip h4 { margin: 0 0 3px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  #tooltip .tt-sub { color: var(--text-muted); font-size: 11.5px; margin-bottom: 4px; }
  #tooltip ul { margin: 4px 0 0; padding-left: 16px; }
  #tooltip li { margin: 2px 0; color: var(--text-secondary); }

  /* ---------- 週報 ---------- */
  .week-toolbar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .week-title { font-weight: 600; font-size: 15px; }
  .report { padding: 6px 18px 18px; }
  .r-day { padding: 10px 0; border-bottom: 1px solid var(--grid); }
  .r-day:last-of-type { border-bottom: none; }
  .r-day h3 { margin: 0 0 6px; font-size: 13.5px; }
  .r-day h3 .wd { color: var(--text-muted); font-weight: 400; margin-left: 6px; font-size: 12.5px; }
  .r-day h3.is-today::after { content: "今天"; background: var(--accent); color:#fff; font-size: 10.5px; border-radius: 8px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; font-weight: 500; }
  .r-entry { display: flex; gap: 8px; margin: 3px 0 3px 4px; align-items: baseline; }
  .r-entry .p-swatch { align-self: center; }
  .r-entry .rp { font-weight: 600; flex: none; }
  .r-entry .rt { color: var(--text-secondary); }
  .r-none { color: var(--text-muted); margin-left: 4px; font-size: 13px; }
  .r-section-title { margin: 18px 0 6px; font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .r-proj { display: flex; gap: 8px; align-items: center; margin: 4px 0 4px 4px; }
  .r-proj .rd { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* ---------- Dialogs ---------- */
  dialog {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface-1);
    color: var(--text-primary);
    padding: 0;
    width: min(440px, calc(100vw - 40px));
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  dialog::backdrop { background: rgba(0,0,0,0.35); }
  .dlg-head { padding: 14px 18px 0; font-size: 15.5px; font-weight: 600; }
  .dlg-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; }
  .dlg-foot { padding: 0 18px 16px; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .dlg-foot .left { margin-right: auto; }
  .field label { display: block; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%;
    font: inherit;
    color: var(--text-primary);
    background: var(--page);
    border: 1px solid var(--baseline);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .field textarea { resize: vertical; min-height: 74px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .log-list { border-top: 1px solid var(--grid); padding-top: 10px; }
  .log-list h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--text-muted); font-weight: 600; }
  .log-item { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; font-size: 13px; }
  .log-item .lt { flex: 1; color: var(--text-secondary); }
  .log-item button { padding: 1px 8px; font-size: 12px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--page);
    border-radius: 8px; padding: 8px 16px; font-size: 13px;
    z-index: 200; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 0.95; }

  /* ---------- 登入與帳號 ---------- */
  #saveStatus { font-size: 12px; color: var(--text-muted); min-width: 56px; text-align: right; }
  .user-chip { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); }
  .user-chip img { width: 26px; height: 26px; border-radius: 50%; }
  .user-chip button { padding: 3px 10px; font-size: 12.5px; }
  #loginOverlay {
    position: fixed; inset: 0; background: var(--page); z-index: 500;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .login-card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 44px; text-align: center; max-width: 380px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
  }
  .login-card h2 { margin: 0 0 8px; font-size: 20px; }
  .login-card p { margin: 0 0 24px; color: var(--text-secondary); font-size: 13.5px; }
  #gsiBtn { display: flex; justify-content: center; min-height: 44px; }
  .login-err { color: #d03b3b; font-size: 12.5px; margin-top: 14px; }
  .login-or {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-muted); font-size: 12px; margin: 18px 0 14px;
  }
  .login-or::before, .login-or::after { content: ""; flex: 1; border-top: 1px solid var(--grid); }
  .login-note { font-size: 12px; color: var(--text-muted); margin: 10px 0 0; line-height: 1.55; }
</style>
</head>
<body>

<header class="app">
  <h1>📊 專案時程追蹤</h1>
  <div class="tabs" role="tablist">
    <button id="tabGantt" class="active" onclick="switchView('gantt')">甘特圖</button>
    <button id="tabWeek" onclick="switchView('week')">週報</button>
  </div>
  <div class="spacer"></div>
  <span id="saveStatus"></span>
  <button class="primary" onclick="openLogDialog()">＋ 記錄今日進度</button>
  <button onclick="openProjectDialog()">＋ 新增專案</button>
  <button class="ghost" onclick="exportData()" title="下載 JSON 備份">匯出</button>
  <button class="ghost" onclick="document.getElementById('importFile').click()" title="從 JSON 備份還原">匯入</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
  <span class="user-chip" id="userChip" style="display:none"></span>
</header>

<div id="loginOverlay" style="display:none">
  <div class="login-card">
    <h2>📊 專案時程追蹤</h2>
    <p>用甘特圖管理專案時程、記錄每日執行內容。<br>使用 Google 帳號登入，你的紀錄會儲存在自己的帳號中，換裝置也能存取。</p>
    <div id="gsiBtn"></div>
    <div class="login-err" id="loginErr" style="display:none"></div>
    <div class="login-or">或</div>
    <button type="button" onclick="enterGuest()">先不登入，在這個裝置使用</button>
    <p class="login-note">未登入時資料只儲存在這個瀏覽器，換裝置或清除瀏覽資料就會遺失；之後隨時可以登入，把資料匯入帳號。</p>
  </div>
</div>

<main>
  <!-- 甘特圖 -->
  <section id="viewGantt" class="card">
    <div class="gantt-toolbar">
      <button class="ghost" onclick="scrollToToday()">回到今天</button>
      <span class="hint">點專案名稱可編輯專案；點時間格子可補記那一天的進度；滑鼠移到圓點上可看當天做了什麼。</span>
    </div>
    <div class="gantt-scroll" id="ganttScroll"></div>
    <div class="legend-note">
      <span class="k"><span class="k-bar"></span>專案期間（尚未輸入進度 %）</span>
      <span class="k"><span class="k-track"><span></span></span>實心＝已完成進度 %</span>
      <span class="k"><span class="k-dot"></span>當天有更新進度 %</span>
      <span class="k"><span class="k-dot hollow"></span>當天有文字紀錄</span>
    </div>
  </section>

  <!-- 週報 -->
  <section id="viewWeek" class="card" style="display:none">
    <div class="week-toolbar">
      <button onclick="shiftWeek(-1)">‹ 上一週</button>
      <button onclick="goThisWeek()">本週</button>
      <button onclick="shiftWeek(1)">下一週 ›</button>
      <span class="week-title" id="weekTitle"></span>
      <div class="spacer" style="flex:1"></div>
      <button onclick="copyWeekReport()">📋 複製週報文字</button>
    </div>
    <div class="report" id="weekReport"></div>
  </section>
</main>

<div id="tooltip"></div>
<div id="toast" class="toast"></div>

<!-- 專案編輯 -->
<dialog id="projectDialog">
  <div class="dlg-head" id="pdTitle">新增專案</div>
  <form method="dialog">
    <div class="dlg-body">
      <div class="field">
        <label for="pdName">專案名稱</label>
        <input id="pdName" required placeholder="例：官網改版">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="pdStart">開始日期</label>
          <input id="pdStart" type="date" required>
        </div>
        <div class="field">
          <label for="pdEnd">預計完成</label>
          <input id="pdEnd" type="date" required>
        </div>
      </div>
      <div class="field">
        <label for="pdStatus">狀態</label>
        <select id="pdStatus">
          <option value="active">進行中</option>
          <option value="done">已完成 ✓</option>
          <option value="paused">暫停</option>
        </select>
      </div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="danger left" id="pdDelete" onclick="deleteProject()">刪除專案</button>
      <button type="button" onclick="projectDialog.close()">取消</button>
      <button class="primary" value="save" onclick="return saveProject(event)">儲存</button>
    </div>
  </form>
</dialog>

<!-- 進度紀錄 -->
<dialog id="logDialog">
  <div class="dlg-head">記錄每日進度</div>
  <form method="dialog">
    <div class="dlg-body">
      <div class="field-row">
        <div class="field">
          <label for="ldDate">日期</label>
          <input id="ldDate" type="date" required onchange="renderDayLogs()">
        </div>
        <div class="field">
          <label for="ldProject">專案</label>
          <select id="ldProject" onchange="renderDayLogs()"></select>
        </div>
      </div>
      <div class="field">
        <label for="ldText">今天執行了什麼？</label>
        <textarea id="ldText" placeholder="例：完成登入頁面切版、修正 API 錯誤處理"></textarea>
      </div>
      <div class="field">
        <label for="ldProgress">整個專案目前完成度 %（選填，算不出來就留空）</label>
        <input id="ldProgress" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="例：60">
      </div>
      <div class="log-list" id="ldExisting"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" onclick="logDialog.close()">關閉</button>
      <button class="primary" value="save" onclick="return saveLog(event)">新增紀錄</button>
    </div>
  </form>
</dialog>

<script>
"use strict";

/* ============ 資料層 ============
   已登入：透過 API 儲存到自己的帳號（資料庫）
   未登入（訪客模式）：儲存在這個瀏覽器的 localStorage */
const STORE_KEY = "gantt-tracker-v1";   // 訪客模式的本機資料，登入後可匯入帳號
const GUEST_KEY = "gantt-tracker-guest"; // 記住「先不登入」的選擇
const SLOT_COUNT = 8;
let state = { projects: [], logs: [] };
let currentUser = null;
let guestMode = false;

async function api(url, opts = {}) {
  const res = await fetch(url, {
    credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    ...opts,
  });
  if (res.status === 401) {
    showLogin();
    throw new Error("unauthorized");
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

/* 儲存：合併短時間內的變更後上傳（去抖 600ms），並顯示儲存狀態 */
let saveTimer = null, saveDirty = false, saveRetry = null;

function save() {
  if (guestMode) {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    setSaveStatus("已存在此裝置 ✓", true);
    return;
  }
  saveDirty = true;
  setSaveStatus("儲存中…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 600);
}

async function flushSave() {
  if (!saveDirty || !currentUser) return;
  saveDirty = false;
  clearTimeout(saveRetry);
  try {
    await api("/api/state", { method: "PUT", body: JSON.stringify(state) });
    if (!saveDirty) setSaveStatus("已儲存 ✓", true);
  } catch (e) {
    saveDirty = true;
    setSaveStatus("儲存失敗，重試中…");
    saveRetry = setTimeout(flushSave, 4000);
  }
}

function setSaveStatus(txt, fade) {
  const el = $("saveStatus");
  el.textContent = txt;
  clearTimeout(el._h);
  if (fade) el._h = setTimeout(() => { el.textContent = ""; }, 2500);
}

/* 關頁前盡量把未儲存的變更送出 */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && saveDirty && currentUser) {
    saveDirty = false;
    fetch("/api/state", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(state),
      keepalive: true,
    }).catch(() => {});
  }
});

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ============ 日期工具（皆為本地時區、YYYY-MM-DD 字串） ============ */
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function fmtD(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayStr() { return fmtD(new Date()); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function diffDays(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
const WD = ["日", "一", "二", "三", "四", "五", "六"];
function mondayOf(s) { const d = parseD(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return fmtD(d); }
function shortD(s) { const d = parseD(s); return (d.getMonth() + 1) + "/" + d.getDate(); }

/* ISO 週數（週一起算，跨年週歸屬含週四的那一年） */
function isoWeek(s) {
  const d = parseD(s);
  d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); // 移到本週四
  const year = d.getFullYear();
  const week1Thu = new Date(year, 0, 4);
  week1Thu.setDate(week1Thu.getDate() + 3 - ((week1Thu.getDay() + 6) % 7));
  return { year, week: 1 + Math.round((d - week1Thu) / 604800000) };
}
/* 週碼：W + 年份末碼 + 兩位週數，例：2026 第 28 週 → W628 */
function weekCode(s) {
  const { year, week } = isoWeek(s);
  return `W${year % 10}${String(week).padStart(2, "0")}`;
}

/* ============ 共用 ============ */
const $ = id => document.getElementById(id);
function esc(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function slotColor(i) { return `var(--s${(i % SLOT_COUNT) + 1})`; }
function projectById(id) { return state.projects.find(p => p.id === id); }
function sortedProjects() {
  return [...state.projects].sort((a, b) => a.start.localeCompare(b.start) || a.name.localeCompare(b.name));
}
const STATUS_LABEL = { active: "進行中", done: "已完成 ✓", paused: "暫停" };

/* 專案目前進度 %：取「最新日期」那筆有填 % 的紀錄（同日以較晚輸入者為準）；沒填過則為 null */
function currentProgress(pid) {
  let best = null, bestDate = "";
  for (const l of state.logs) {
    if (l.projectId === pid && l.progress != null && l.date >= bestDate) {
      best = l.progress;
      bestDate = l.date;
    }
  }
  return best;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

function refresh() {
  save();
  renderGantt();
  renderWeek();
}

/* ============ 甘特圖 ============ */
const DW = 30; // 每日欄寬 px
document.documentElement.style.setProperty("--dw", DW + "px");

function ganttRange() {
  const today = todayStr();
  let min = addDays(today, -10), max = addDays(today, 20);
  for (const p of state.projects) {
    if (p.start < min) min = p.start;
    if (p.end > max) max = p.end;
  }
  for (const l of state.logs) {
    if (l.date < min) min = l.date;
    if (l.date > max) max = l.date;
  }
  return { min: addDays(min, -3), max: addDays(max, 5) };
}

function renderGantt() {
  const wrap = $("ganttScroll");
  const projects = sortedProjects();

  if (projects.length === 0) {
    wrap.innerHTML = `<div class="empty-state">
      <p>還沒有任何專案。先建立一個專案，之後每天記錄進度就會自動顯示在甘特圖上。</p>
      <button class="primary" onclick="openProjectDialog()">＋ 新增第一個專案</button>
      <button onclick="loadSampleData()" style="margin-left:8px">載入範例資料看看效果</button>
    </div>`;
    return;
  }

  const { min, max } = ganttRange();
  const nDays = diffDays(min, max) + 1;
  const today = todayStr();

  // 依專案+日期彙整紀錄
  const logMap = {}; // key: projectId|date -> [log entries]
  for (const l of state.logs) {
    (logMap[l.projectId + "|" + l.date] ||= []).push(l);
  }

  // 表頭：月份列
  let monthCells = "";
  {
    let i = 0;
    while (i < nDays) {
      const d = parseD(addDays(min, i));
      const y = d.getFullYear(), m = d.getMonth();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const span = Math.min(daysInMonth - d.getDate() + 1, nDays - i);
      monthCells += `<div class="g-month" style="width:${span * DW}px"><span>${y}年${m + 1}月</span></div>`;
      i += span;
    }
  }

  // 表頭：週碼列（W + 年末碼 + 週數；每格為週一到週日，點擊可跳到該週週報）
  let weekCells = "";
  {
    const curMonday = mondayOf(today);
    let i = 0;
    while (i < nDays) {
      const ds = addDays(min, i);
      const dow = (parseD(ds).getDay() + 6) % 7; // 0 = 週一
      const span = Math.min(7 - dow, nDays - i);
      const code = weekCode(ds);
      const mon = mondayOf(ds);
      weekCells += `<div class="g-wk ${mon === curMonday ? "cur" : ""}" style="width:${span * DW}px" data-ws="${mon}" title="${code}（點擊查看該週週報）">${span >= 2 ? code : ""}</div>`;
      i += span;
    }
  }

  // 表頭：日期列
  let dayCells = "";
  for (let i = 0; i < nDays; i++) {
    const ds = addDays(min, i);
    const d = parseD(ds);
    const wd = d.getDay();
    const cls = ["g-day", (wd === 0 || wd === 6) && "weekend", ds === today && "today"].filter(Boolean).join(" ");
    dayCells += `<div class="${cls}" ${ds === today ? 'id="todayHead"' : ""}><span class="dnum">${d.getDate()}</span><br>${WD[wd]}</div>`;
  }

  // 各專案列
  let rows = "";
  projects.forEach((p) => {
    const color = slotColor(p.slot);
    let cells = "";
    for (let i = 0; i < nDays; i++) {
      const ds = addDays(min, i);
      const d = parseD(ds);
      const wd = d.getDay();
      const cls = ["g-cell", (wd === 0 || wd === 6) && "weekend", ds === today && "today"].filter(Boolean).join(" ");
      cells += `<div class="${cls}" data-pid="${p.id}" data-date="${ds}"></div>`;
    }

    // 專案期間長條：有進度 % → 空心軌道 + 實心已完成段；沒有 % → 原本的實心長條
    const s = Math.max(0, diffDays(min, p.start));
    const e = Math.min(nDays - 1, diffDays(min, p.end));
    const prog = currentProgress(p.id);
    let bar = "";
    if (e >= s) {
      const barStyle = `left:${s * DW + 2}px;width:${(e - s + 1) * DW - 4}px;--c:${color}`;
      if (prog != null && p.status !== "done") {
        const pctLabel = prog <= 80
          ? `<span class="g-pct" style="left:calc(${prog}% + 5px)">${prog}%</span>`
          : `<span class="g-pct" style="left:calc(100% + 5px)">${prog}%</span>`;
        bar = `<div class="g-bar track" style="${barStyle}"><div class="g-fill" style="width:${prog}%"></div>${pctLabel}</div>`;
      } else {
        bar = `<div class="g-bar ${p.status === "done" ? "done" : ""}" style="${barStyle}"></div>`;
      }
    }

    // 每日紀錄圓點：實心＝當天有更新進度 %，空心＝純文字紀錄
    let dots = "";
    for (const key in logMap) {
      const [pid, ds] = key.split("|");
      if (pid !== p.id) continue;
      const idx = diffDays(min, ds);
      if (idx < 0 || idx >= nDays) continue;
      const hasProg = logMap[key].some(l => l.progress != null);
      dots += `<div class="g-dot ${hasProg ? "" : "hollow"}" style="left:${idx * DW + (DW - 10) / 2}px;--c:${color}" data-pid="${p.id}" data-date="${ds}"></div>`;
    }

    const statusCls = p.status === "done" ? "done" : p.status === "paused" ? "paused" : "";
    const statusTxt = p.status === "active" ? "" : `<span class="p-status ${statusCls}">${STATUS_LABEL[p.status]}</span>`;
    const progTxt = (prog != null && p.status !== "done") ? `・目前 ${prog}%` : "";
    rows += `
      <div class="g-row">
        <div class="g-namecol" onclick="openProjectDialog('${p.id}')" title="點擊編輯專案">
          <div class="p-name"><span class="p-swatch" style="background:${color}"></span>${esc(p.name)}${statusTxt}</div>
          <div class="p-dates">${shortD(p.start)} – ${shortD(p.end)}（${diffDays(p.start, p.end) + 1} 天）${progTxt}</div>
        </div>
        <div class="g-timeline">${cells}${bar}${dots}</div>
      </div>`;
  });

  wrap.innerHTML = `
    <div class="gantt" style="grid-template-columns: 226px ${nDays * DW}px">
      <div class="g-headrow g-row">
        <div class="g-namecol"></div>
        <div class="g-timeline">${monthCells}</div>
      </div>
      <div class="g-headrow g-row">
        <div class="g-namecol" style="grid-row:2"></div>
        <div class="g-timeline">${weekCells}</div>
      </div>
      <div class="g-headrow g-row">
        <div class="g-namecol" style="grid-row:3"></div>
        <div class="g-timeline">${dayCells}</div>
      </div>
      ${rows}
    </div>`;

  wrap._minDate = min;
  requestAnimationFrame(scrollToToday);
}

function scrollToToday() {
  const wrap = $("ganttScroll");
  if (!wrap._minDate) return;
  const idx = diffDays(wrap._minDate, todayStr());
  wrap.scrollLeft = Math.max(0, idx * DW - wrap.clientWidth / 2 + 113);
}

/* 甘特圖互動：點格子補記、hover 圓點/長條顯示 tooltip */
$("ganttScroll").addEventListener("click", e => {
  const dot = e.target.closest(".g-dot");
  if (dot) { openLogDialog(dot.dataset.pid, dot.dataset.date); return; }
  const wk = e.target.closest(".g-wk");
  if (wk) { weekStart = wk.dataset.ws; switchView("week"); renderWeek(); return; }
  const cell = e.target.closest(".g-cell");
  if (cell) openLogDialog(cell.dataset.pid, cell.dataset.date);
});

const tooltip = $("tooltip");
$("ganttScroll").addEventListener("mousemove", e => {
  const dot = e.target.closest(".g-dot");
  const cell = !dot && e.target.closest(".g-cell");
  let html = "";
  if (dot) {
    const p = projectById(dot.dataset.pid);
    const items = state.logs.filter(l => l.projectId === dot.dataset.pid && l.date === dot.dataset.date);
    html = `<h4><span class="p-swatch" style="background:${slotColor(p.slot)}"></span>${esc(p.name)}</h4>
      <div class="tt-sub">${dot.dataset.date}（${WD[parseD(dot.dataset.date).getDay()]}）的執行紀錄</div>
      <ul>${items.map(l => `<li>${esc(l.text || "（進度更新）")}${l.progress != null ? `　→ 進度 ${l.progress}%` : ""}</li>`).join("")}</ul>`;
  } else if (cell) {
    const p = projectById(cell.dataset.pid);
    const remain = diffDays(todayStr(), p.end);
    const prog = currentProgress(p.id);
    html = `<h4><span class="p-swatch" style="background:${slotColor(p.slot)}"></span>${esc(p.name)}</h4>
      <div class="tt-sub">${p.start} → ${p.end} ・ ${STATUS_LABEL[p.status]}${prog != null && p.status !== "done" ? ` ・ 目前進度 ${prog}%` : ""}${p.status === "active" ? (remain >= 0 ? ` ・ 還剩 ${remain} 天` : ` ・ 已超過預計完成日 ${-remain} 天`) : ""}</div>
      <div class="tt-sub">點擊可記錄 ${cell.dataset.date} 的進度</div>`;
  }
  if (!html) { tooltip.style.display = "none"; return; }
  tooltip.innerHTML = html;
  tooltip.style.display = "block";
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = tooltip.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
});
$("ganttScroll").addEventListener("mouseleave", () => { tooltip.style.display = "none"; });

/* ============ 專案對話框 ============ */
const projectDialog = $("projectDialog");
let editingProjectId = null;

function openProjectDialog(id) {
  editingProjectId = id || null;
  $("pdTitle").textContent = id ? "編輯專案" : "新增專案";
  $("pdDelete").style.display = id ? "" : "none";
  if (id) {
    const p = projectById(id);
    $("pdName").value = p.name;
    $("pdStart").value = p.start;
    $("pdEnd").value = p.end;
    $("pdStatus").value = p.status;
  } else {
    $("pdName").value = "";
    $("pdStart").value = todayStr();
    $("pdEnd").value = addDays(todayStr(), 13);
    $("pdStatus").value = "active";
  }
  projectDialog.showModal();
}

function saveProject(e) {
  e.preventDefault();
  const name = $("pdName").value.trim();
  const start = $("pdStart").value, end = $("pdEnd").value;
  if (!name || !start || !end) { toast("請填寫名稱與日期"); return false; }
  if (end < start) { toast("預計完成日不能早於開始日"); return false; }
  if (editingProjectId) {
    Object.assign(projectById(editingProjectId), { name, start, end, status: $("pdStatus").value });
  } else {
    const usedSlots = state.projects.map(p => p.slot % SLOT_COUNT);
    let slot = 0;
    while (usedSlots.includes(slot % SLOT_COUNT) && slot < SLOT_COUNT) slot++;
    if (slot >= SLOT_COUNT) slot = state.projects.length % SLOT_COUNT;
    state.projects.push({ id: uid(), name, start, end, status: $("pdStatus").value, slot });
  }
  projectDialog.close();
  refresh();
  return false;
}

function deleteProject() {
  const p = projectById(editingProjectId);
  const n = state.logs.filter(l => l.projectId === editingProjectId).length;
  if (!confirm(`確定刪除「${p.name}」？${n ? `其 ${n} 筆每日紀錄也會一併刪除。` : ""}`)) return;
  state.projects = state.projects.filter(x => x.id !== editingProjectId);
  state.logs = state.logs.filter(l => l.projectId !== editingProjectId);
  projectDialog.close();
  refresh();
}

/* ============ 進度紀錄對話框 ============ */
const logDialog = $("logDialog");

function openLogDialog(projectId, date) {
  if (state.projects.length === 0) {
    toast("請先建立至少一個專案");
    openProjectDialog();
    return;
  }
  const sel = $("ldProject");
  sel.innerHTML = sortedProjects()
    .map(p => `<option value="${p.id}">${esc(p.name)}${p.status !== "active" ? `（${STATUS_LABEL[p.status]}）` : ""}</option>`)
    .join("");
  if (projectId) sel.value = projectId;
  $("ldDate").value = date || todayStr();
  $("ldText").value = "";
  $("ldProgress").value = "";
  renderDayLogs();
  logDialog.showModal();
  $("ldText").focus();
}

function renderDayLogs() {
  const pid = $("ldProject").value, date = $("ldDate").value;
  const items = state.logs.filter(l => l.projectId === pid && l.date === date);
  const box = $("ldExisting");
  if (items.length === 0) { box.innerHTML = ""; box.style.display = "none"; return; }
  box.style.display = "";
  box.innerHTML = `<h4>${date} 已有的紀錄</h4>` + items.map(l =>
    `<div class="log-item"><span class="lt">・${l.progress != null ? `<b>[${l.progress}%]</b> ` : ""}${esc(l.text || "（進度更新）")}</span><button type="button" onclick="deleteLog('${l.id}')">刪除</button></div>`
  ).join("");
}

function saveLog(e) {
  e.preventDefault();
  const text = $("ldText").value.trim();
  const progRaw = $("ldProgress").value.trim();
  let progress = null;
  if (progRaw !== "") {
    progress = Math.round(Number(progRaw));
    if (Number.isNaN(progress) || progress < 0 || progress > 100) {
      toast("進度 % 請輸入 0–100 的數字，或留空");
      return false;
    }
  }
  if (!text && progress === null) { toast("請輸入執行內容，或至少填進度 %"); return false; }
  const entry = { id: uid(), date: $("ldDate").value, projectId: $("ldProject").value, text };
  if (progress !== null) entry.progress = progress;
  state.logs.push(entry);
  $("ldText").value = "";
  $("ldProgress").value = "";
  save();
  renderDayLogs();
  renderGantt();
  renderWeek();
  toast("已記錄 ✓ 甘特圖已更新");
  return false;
}

function deleteLog(id) {
  state.logs = state.logs.filter(l => l.id !== id);
  save();
  renderDayLogs();
  renderGantt();
  renderWeek();
}

/* ============ 週報 ============ */
let weekStart = mondayOf(todayStr());

function switchView(v) {
  $("viewGantt").style.display = v === "gantt" ? "" : "none";
  $("viewWeek").style.display = v === "week" ? "" : "none";
  $("tabGantt").classList.toggle("active", v === "gantt");
  $("tabWeek").classList.toggle("active", v === "week");
  if (v === "gantt") scrollToToday();
}
function shiftWeek(n) { weekStart = addDays(weekStart, n * 7); renderWeek(); }
function goThisWeek() { weekStart = mondayOf(todayStr()); renderWeek(); }

function weekData() {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const ds = addDays(weekStart, i);
    const entries = state.logs
      .filter(l => l.date === ds)
      .map(l => ({ ...l, project: projectById(l.projectId) }))
      .filter(l => l.project)
      .sort((a, b) => a.project.start.localeCompare(b.project.start));
    days.push({ ds, entries });
  }
  const weekEnd = addDays(weekStart, 6);
  const ongoing = sortedProjects().filter(p => p.status !== "done" && p.start <= weekEnd && p.end >= weekStart || p.status === "active" && p.start <= weekEnd);
  return { days, weekEnd, ongoing };
}

function renderWeek() {
  const { days, weekEnd, ongoing } = weekData();
  $("weekTitle").textContent = `${weekCode(weekStart)}・${weekStart.replaceAll("-", "/")} – ${shortD(weekEnd)}`;
  const today = todayStr();

  let html = "";
  for (const { ds, entries } of days) {
    const d = parseD(ds);
    html += `<div class="r-day">
      <h3 class="${ds === today ? "is-today" : ""}">${shortD(ds)}<span class="wd">週${WD[d.getDay()]}</span></h3>`;
    if (entries.length === 0) {
      html += `<div class="r-none">— 無紀錄</div>`;
    } else {
      for (const l of entries) {
        html += `<div class="r-entry">
          <span class="p-swatch" style="background:${slotColor(l.project.slot)}"></span>
          <span class="rp">${esc(l.project.name)}</span>
          <span class="rt">${esc(l.text || "（進度更新）")}${l.progress != null ? `　<b>進度 ${l.progress}%</b>` : ""}</span>
        </div>`;
      }
    }
    html += `</div>`;
  }

  if (ongoing.length) {
    html += `<div class="r-section-title">目前進行中的專案</div>`;
    for (const p of ongoing) {
      const remain = diffDays(today, p.end);
      const prog = currentProgress(p.id);
      html += `<div class="r-proj">
        <span class="p-swatch" style="background:${slotColor(p.slot)}"></span>
        <span class="rp">${esc(p.name)}</span>
        <span class="rd">${shortD(p.start)} – ${shortD(p.end)}${prog != null ? ` ・ 進度 ${prog}%` : ""}${p.status === "paused" ? " ・ 暫停" : remain >= 0 ? ` ・ 還剩 ${remain} 天` : ` ・ 已逾期 ${-remain} 天`}</span>
      </div>`;
    }
  }
  $("weekReport").innerHTML = html;
}

function copyWeekReport() {
  const { days, weekEnd, ongoing } = weekData();
  let txt = `週報 ${weekCode(weekStart)}（${weekStart.replaceAll("-", "/")} – ${weekEnd.replaceAll("-", "/")}）\n\n`;
  for (const { ds, entries } of days) {
    txt += `【${shortD(ds)}（${WD[parseD(ds).getDay()]}）】\n`;
    if (entries.length === 0) txt += `- （無紀錄）\n`;
    else for (const l of entries) {
      const pct = l.progress != null ? `（進度 ${l.progress}%）` : "";
      txt += `- ${l.project.name}：${l.text || "進度更新"}${pct}\n`;
    }
    txt += "\n";
  }
  if (ongoing.length) {
    txt += `進行中專案：\n`;
    for (const p of ongoing) {
      const prog = currentProgress(p.id);
      txt += `- ${p.name}（${shortD(p.start)} – ${shortD(p.end)}${prog != null ? `，進度 ${prog}%` : ""}）\n`;
    }
  }
  navigator.clipboard.writeText(txt)
    .then(() => toast("已複製週報文字 ✓"))
    .catch(() => { prompt("複製以下文字：", txt); });
}

/* ============ 匯出 / 匯入 / 範例 ============ */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `專案時程備份-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.projects) || !Array.isArray(data.logs)) throw new Error("格式不符");
      if (!confirm(`匯入將取代目前的資料（${data.projects.length} 個專案、${data.logs.length} 筆紀錄）。確定？`)) return;
      state = data;
      refresh();
      toast("匯入成功 ✓");
    } catch (e) {
      toast("匯入失敗：不是有效的備份檔");
    }
  };
  reader.readAsText(file);
  ev.target.value = "";
}

/* ============ 登入 / 啟動 ============ */
let googleClientId = "";
let gsiReady = false;

async function init() {
  try {
    const cfg = await fetch("/api/config", { credentials: "same-origin" }).then(r => r.json());
    googleClientId = cfg.googleClientId || "";
  } catch (e) { /* 稍後在登入畫面顯示錯誤 */ }

  // 之前選過「先不登入」：直接進訪客模式
  if (localStorage.getItem(GUEST_KEY)) {
    enterGuest();
    return;
  }

  try {
    currentUser = await api("/api/me");
    await enterApp();
  } catch (e) { /* 未登入：api() 已呼叫 showLogin() */ }
}

function showLogin() {
  currentUser = null;
  $("loginOverlay").style.display = "";
  if (!googleClientId) {
    loginError("尚未設定 GOOGLE_CLIENT_ID，暫時無法使用 Google 登入；仍可選擇下方「先不登入」。");
    return;
  }
  if (gsiReady) { renderGsiButton(); return; }
  const s = document.createElement("script");
  s.src = "https://accounts.google.com/gsi/client";
  s.async = true;
  s.onload = () => {
    google.accounts.id.initialize({ client_id: googleClientId, callback: onGoogleCredential });
    gsiReady = true;
    renderGsiButton();
  };
  s.onerror = () => loginError("無法載入 Google 登入元件，請檢查網路；仍可選擇下方「先不登入」。");
  document.head.appendChild(s);
}

function renderGsiButton() {
  $("gsiBtn").innerHTML = "";
  google.accounts.id.renderButton($("gsiBtn"), { theme: "outline", size: "large", text: "signin_with", locale: "zh_TW", width: 280 });
}

function loginError(msg) {
  const el = $("loginErr");
  el.textContent = msg;
  el.style.display = "";
}

async function onGoogleCredential(resp) {
  try {
    currentUser = await api("/api/auth/google", { method: "POST", body: JSON.stringify({ credential: resp.credential }) });
    guestMode = false;
    localStorage.removeItem(GUEST_KEY);
    await enterApp();
  } catch (e) {
    loginError("登入失敗，請再試一次。");
  }
}

/* 訪客模式：不登入，資料存在這個瀏覽器 */
function enterGuest() {
  guestMode = true;
  currentUser = null;
  localStorage.setItem(GUEST_KEY, "1");
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    state = {
      projects: (raw && Array.isArray(raw.projects)) ? raw.projects : [],
      logs: (raw && Array.isArray(raw.logs)) ? raw.logs : [],
    };
  } catch (e) { state = { projects: [], logs: [] }; }
  $("loginOverlay").style.display = "none";

  const chip = $("userChip");
  chip.style.display = "";
  chip.innerHTML = `<span title="未登入，資料只存在這個瀏覽器">未登入・資料存在此裝置</span>
    <button type="button" onclick="switchToLogin()">登入</button>`;

  renderGantt();
  renderWeek();
}

/* 訪客模式中點「登入」：重新顯示登入畫面（按「先不登入」即可返回） */
function switchToLogin() {
  localStorage.removeItem(GUEST_KEY);
  showLogin();
}

async function enterApp() {
  state = await api("/api/state");
  $("loginOverlay").style.display = "none";

  // 顯示使用者資訊
  const chip = $("userChip");
  chip.style.display = "";
  chip.innerHTML = `${currentUser.picture ? `<img src="${esc(currentUser.picture)}" alt="" referrerpolicy="no-referrer">` : ""}
    <span>${esc(currentUser.name || currentUser.email)}</span>
    <button type="button" onclick="logout()">登出</button>`;

  // 帳號還沒有資料時，若這個瀏覽器有本機資料（訪客模式或舊版），提議匯入
  if (state.projects.length === 0 && state.logs.length === 0) {
    try {
      const old = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
      if (old && ((old.projects || []).length || (old.logs || []).length)) {
        if (confirm(`這個瀏覽器有未登入時的本機資料（${(old.projects || []).length} 個專案、${(old.logs || []).length} 筆紀錄），要匯入你的帳號嗎？`)) {
          state = { projects: old.projects || [], logs: old.logs || [] };
          save();
          localStorage.removeItem(STORE_KEY);
        }
      }
    } catch (e) { /* 舊資料格式錯誤就略過 */ }
  }

  renderGantt();
  renderWeek();
}

async function logout() {
  await flushSave();
  try { await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" }); } catch (e) {}
  location.reload();
}

init();
